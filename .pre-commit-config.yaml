# Pre-commit/pre-push configuration for local_suap
# See https://pre-commit.com for more information
#
# O hook executa o mesmo workflow de CI do GitHub (.github/workflows/ci.yml) localmente via `act`,
# dentro do Docker, antes do `git push`
# (é lento demais para rodar a cada commit). Não é necessário ter PHP instalado: apenas Python, pre-commit, Docker e act.
repos:
  - repo: local
    hooks:
      - id: act-ci
        name: Validar CI com act
        entry: act -j ci --matrix php:8.3 --matrix database:pgsql --matrix moodle-branch:MOODLE_405_STABLE --reuse
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
