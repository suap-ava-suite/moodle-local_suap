name: Build & Deploy Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx moodle-docs-theme

      - name: Build Documentation with Sphinx
        run: |
          sphinx-build -W -b html docs/pt-br docs/_build/html/pt-br
          sphinx-build -W -b html docs/en docs/_build/html/en
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=pt-br/"><title>moodle-local_suap Documentation</title></head><body><p>Redirecting to <a href="pt-br/">Português (pt-BR)</a> or <a href="en/">English (en)</a>...</p></body></html>' > docs/_build/html/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy Docs to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
