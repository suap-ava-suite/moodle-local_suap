name: Moodle Plugin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3']
        moodle-branch: ['MOODLE_401_STABLE', 'MOODLE_402_STABLE', 'MOODLE_403_STABLE']
        database: [pgsql, mariadb]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, gd, curl, intl, soap
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/vendor/bin >> $GITHUB_PATH
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH
          php -d max_input_vars=10000 $(cd ci && pwd)/bin/moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: always()
        run: moodle-plugin-ci phplint local_suap

      - name: PHP Copy/Paste Detector
        continue-on-error: true
        if: always()
        run: moodle-plugin-ci phpcpd local_suap

      - name: PHP Mess Detector
        continue-on-error: true
        if: always()
        run: moodle-plugin-ci phpmd local_suap

      - name: Moodle Code Checker
        if: always()
        run: moodle-plugin-ci codechecker local_suap --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: always()
        run: moodle-plugin-ci phpdoc local_suap --max-warnings 0

      - name: Validating
        if: always()
        run: moodle-plugin-ci validate local_suap

      - name: Check upgrade savepoints
        if: always()
        run: moodle-plugin-ci savepoints local_suap

      - name: Mustache Lint
        if: always()
        run: moodle-plugin-ci mustache local_suap

      - name: Grunt
        continue-on-error: true
        if: always()
        run: moodle-plugin-ci grunt local_suap --max-lint-warnings 0

      - name: PHPUnit tests
        if: always()
        run: moodle-plugin-ci phpunit local_suap --fail-on-warning

      - name: Behat features
        if: always()
        run: moodle-plugin-ci behat local_suap --profile chrome

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3
